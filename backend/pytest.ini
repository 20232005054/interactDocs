[pytest]
# Pytest 配置文件

# 测试目录
testpaths = tests

# 输出选项
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# 标记
markers =
    unit: 单元测试
    integration: 集成测试
    performance: 性能测试
    ab_test: A/B 测试
    slow: 慢速测试
    requires_db: 需要数据库
    requires_ai: 需要 AI 服务

# 异步测试
asyncio_mode = auto

# 覆盖率配置（使用 pytest-cov）
# 运行: pytest --cov=services/langchain --cov-report=html --cov-report=term
